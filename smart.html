<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            drip: {
              '0%': { transform: 'translateY(-100%)', opacity: '0' },
              '30%': { opacity: '1' },
              '100%': { transform: 'translateY(100vh)', opacity: '0' },
            },
          },
          animation: {
            drip: 'drip 1s linear infinite',
          }
        }
      }
    };
  </script>
  <style>
    /* Optional: slightly different delays for realism */
    .drop:nth-child(1) { animation-delay: 0.4s; left: 10%; }
    .drop:nth-child(2) { animation-delay: 0.2s; left: 20%; }
    .drop:nth-child(3) { animation-delay: 0.8s; left: 30%; }
    .drop:nth-child(4) { animation-delay: 0.6s; left: 40%; }
    .drop:nth-child(5) { animation-delay: 0.3s; left: 50%; }
    .drop:nth-child(6) { animation-delay: 0.9s; left: 60%; }
    .drop:nth-child(7) { animation-delay: 0.15s; left: 70%; }
    .drop:nth-child(8) { animation-delay: 0.18s; left: 80%; }
    .drop:nth-child(9) { animation-delay: 0.1s; left: 90%; }
  </style>
</head>
<body class="relative overflow-hidden bg-black">

    <div class="absolute inset-0 z-0">
    <span class="drop absolute top-0 w-1 h-5 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
    <span class="drop absolute top-0 w-1 h-6 bg-blue-300 rounded-full animate-drip"></span>
  </div>

    <div class="flex items-center justify-center text-[35px] font-bold italic h-screen bg-gradient-to-r from-pink-800 to-green-800 animate-rain-drop">
         <div class="flex flex-col max-w-lg items-center justify-center text-center">
            <h1 class="text-shadow-lg/100 text-blue-500 text-[50px]">Smart Watch</h1>
            <div class="time m-20 shadow-xl/200 w-100 h-70 flex flex-row justify-between font-bold text-[35px] items-center text-center 
            bg-gradient-to-r from-pink-500 to-green-500 rounded"></div>
        </div>
        
    </div>

</body>
    <script>
        const timeEle = document.querySelector(".time");
        function updateTime() {
            const date = new Date();
           const hour = String(date.getHours()).padStart(2, '0');
           const minutes = String(date.getMinutes()).padStart(2, '0')
           const second = String(date.getSeconds()).padStart(2, '0')
           const day = String(date.getDate()).padStart(2, '0');
           const month = String(date.getMonth() + 1).padStart(2, '0');
           const year = date.getFullYear();
           const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
           const dayName = dayNames[date.getDay()];
           timeEle.innerHTML = `${hour}:${minutes}:${second} ${date.getHours()>=12?'PM':'AM'}  ${day}/${month}/${year} (${dayName})`;
        }
        setInterval(updateTime, 1000)
        updateTime() // Initial call to set time immediately    
        
    </script>
</html>
